<script type="text/javascript">
	(function () {
		// resource -> [label, operations, operations without ID, parent id label, operations with parent id];
		// the same as nodes/lib/resources.js (checked by the tests)
		const RESOURCES = {
			booking: ['Booking', ['get', 'getAll', 'create', 'update']],
			company: ['Company', ['get', 'getAll', 'create', 'update']],
			event: ['Event', ['get', 'getAll', 'create', 'update']],
			eventSignUp: ['Event Sign-Up', ['get', 'getAll', 'create', 'update']],
			invoice: ['Invoice', ['get', 'getAll', 'create', 'getPdf']],
			newsArticle: ['News Article', ['get', 'getAll', 'create', 'update']],
			offer: ['Offer', ['get', 'getAll', 'create', 'getPdf']],
			person: ['Person', ['get', 'getAll', 'create', 'update']],
			project: ['Project', ['get', 'getAll', 'create', 'update']],
			smartLock: ['Smart Lock', ['get', 'getAll', 'unlock', 'lock', 'status']],
			smartLockLog: ['Smart Lock Log', ['get', 'getAll']],
			ticket: ['Ticket', ['get', 'getAll', 'create', 'update']],
			timeEntry: ['Time Entry', ['get', 'getAll', 'create', 'update']],
			webhook: ['Webhook', ['get', 'getAll', 'create', 'update']],
			inventoryLoan: ['Inventory Loan', ['get', 'getAll', 'create', 'returnLoan', 'extend', 'stock', 'availability'], ['getAll', 'create', 'stock']],
			attendanceList: ['Attendance List', ['get', 'getAll', 'create', 'update']],
			attendanceListEntry: ['Attendance List Entry', ['get', 'getAll', 'create', 'update'], null, 'Attendance list ID', ['getAll', 'create']],
			shiftPlanEntry: ['Shift Plan Entry', ['get', 'getAll', 'create', 'update', 'clockIn', 'clockOut']],
			occupancy: ['Occupancy', ['getOccupancy'], ['getOccupancy']],
			usageCounter: ['Usage Counter', ['get', 'getAll', 'create', 'update', 'setValue']],
			userNotification: ['Notification', ['get', 'getAll', 'markRead']],
		};
		const OPERATIONS = {
			get: 'Get',
			getAll: 'Get Many',
			create: 'Create',
			update: 'Update (PATCH)',
			getPdf: 'Get PDF',
			unlock: 'Unlock (open)',
			lock: 'Lock',
			status: 'Status',
			returnLoan: 'Return',
			extend: 'Extend',
			stock: 'Stock Overview',
			availability: 'Availability',
			clockIn: 'Clock In',
			clockOut: 'Clock Out',
			getOccupancy: 'Get Occupancy',
			setValue: 'Set Value',
			markRead: 'Mark as Read',
		};
		const ID_PLACEHOLDERS = {
			availability: 'bookable (inventory item) id, or msg.id',
			getOccupancy: 'bookable ids, optional (7,8), or msg.id',
		};

		function operationsFor(resource) {
			return RESOURCES[resource] ? RESOURCES[resource][1] : [];
		}

		function withoutId(resource) {
			return (RESOURCES[resource] && RESOURCES[resource][2]) || ['getAll', 'create'];
		}

		RED.nodes.registerType('inwendo-erp', {
			category: 'vynst (inwendo ERP)',
			color: '#7fb7df',
			defaults: {
				name: { value: '' },
				server: { value: '', type: 'inwendo-erp-config', required: true },
				resource: { value: 'company' },
				operation: { value: 'getAll' },
				entityId: { value: '' },
				returnAll: { value: false },
				limit: { value: 50 },
				searchString: { value: '' },
				method: { value: 'GET' },
				endpoint: { value: '' },
				parentId: { value: '' },
			},
			inputs: 1,
			outputs: 1,
			icon: 'inwendo.png',
			label: function () {
				if (this.name) {
					return this.name;
				}
				if (this.resource === 'genericRequest') {
					return (this.method || 'GET') + ' ' + (this.endpoint || 'vynst');
				}
				const resource = RESOURCES[this.resource];
				return (OPERATIONS[this.operation] || this.operation) + ': ' + (resource ? resource[0] : this.resource);
			},
			paletteLabel: 'vynst',
			oneditprepare: function () {
				const node = this;
				const resourceSelect = $('#node-input-resource');
				Object.keys(RESOURCES).forEach((key) => resourceSelect.append($('<option>').val(key).text(RESOURCES[key][0])));
				resourceSelect.append($('<option>').val('genericRequest').text('Generic API Request'));
				resourceSelect.val(node.resource);

				function update() {
					const resource = resourceSelect.val();
					const generic = resource === 'genericRequest';
					$('.inwendo-erp-generic').toggle(generic);
					$('.inwendo-erp-resource').toggle(!generic);
					const operationSelect = $('#node-input-operation');
					const current = operationSelect.val() || node.operation;
					operationSelect.empty();
					operationsFor(resource).forEach((operation) => operationSelect.append($('<option>').val(operation).text(OPERATIONS[operation])));
					const operations = operationsFor(resource);
					operationSelect.val(operations.includes(current) ? current : operations.includes('getAll') ? 'getAll' : operations[0]);
					updateOperation();
				}

				function updateOperation() {
					const operation = $('#node-input-operation').val();
					const resource = resourceSelect.val();
					const generic = resource === 'genericRequest';
					const definition = RESOURCES[resource] || [];
					$('.inwendo-erp-id').toggle(!generic && (!withoutId(resource).includes(operation) || !!ID_PLACEHOLDERS[operation]));
					$('#node-input-entityId').attr('placeholder', ID_PLACEHOLDERS[operation] || 'or msg.id');
					$('.inwendo-erp-parent').toggle(!generic && !!definition[3] && (definition[4] || []).includes(operation));
					$('#node-input-parentId').attr('placeholder', (definition[3] || '') + ' (or msg.parentId)');
					$('.inwendo-erp-list').toggle(!generic && operation === 'getAll');
					$('.inwendo-erp-limit').toggle(!generic && operation === 'getAll' && !$('#node-input-returnAll').is(':checked'));
				}

				resourceSelect.on('change', update);
				$('#node-input-operation').on('change', updateOperation);
				$('#node-input-returnAll').on('change', updateOperation);
				update();
			},
		});
	})();
</script>

<script type="text/html" data-template-name="inwendo-erp">
	<div class="form-row">
		<label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
		<input type="text" id="node-input-name" />
	</div>
	<div class="form-row">
		<label for="node-input-server"><i class="fa fa-server"></i> ERP</label>
		<input type="text" id="node-input-server" />
	</div>
	<div class="form-row">
		<label for="node-input-resource"><i class="fa fa-database"></i> Resource</label>
		<select id="node-input-resource"></select>
	</div>
	<div class="form-row inwendo-erp-resource">
		<label for="node-input-operation"><i class="fa fa-cog"></i> Operation</label>
		<select id="node-input-operation"></select>
	</div>
	<div class="form-row inwendo-erp-id">
		<label for="node-input-entityId"><i class="fa fa-hashtag"></i> ID</label>
		<input type="text" id="node-input-entityId" placeholder="or msg.id" />
	</div>
	<div class="form-row inwendo-erp-parent">
		<label for="node-input-parentId"><i class="fa fa-sitemap"></i> List ID</label>
		<input type="text" id="node-input-parentId" placeholder="or msg.parentId" />
	</div>
	<div class="form-row inwendo-erp-list">
		<label for="node-input-searchString"><i class="fa fa-search"></i> Search</label>
		<input type="text" id="node-input-searchString" placeholder="or msg.searchString" />
	</div>
	<div class="form-row inwendo-erp-list">
		<label for="node-input-returnAll">&nbsp;</label>
		<label for="node-input-returnAll" style="width: 70%">
			<input type="checkbox" id="node-input-returnAll" style="display: inline-block; width: auto; vertical-align: top" />
			Return all (read every page)
		</label>
	</div>
	<div class="form-row inwendo-erp-limit">
		<label for="node-input-limit"><i class="fa fa-list-ol"></i> Limit</label>
		<input type="number" id="node-input-limit" min="1" />
	</div>
	<div class="form-row inwendo-erp-generic">
		<label for="node-input-method"><i class="fa fa-exchange"></i> Method</label>
		<select id="node-input-method">
			<option value="GET">GET</option>
			<option value="POST">POST</option>
			<option value="PUT">PUT</option>
			<option value="PATCH">PATCH</option>
			<option value="DELETE">DELETE</option>
		</select>
	</div>
	<div class="form-row inwendo-erp-generic">
		<label for="node-input-endpoint"><i class="fa fa-link"></i> Endpoint</label>
		<input type="text" id="node-input-endpoint" placeholder="/api/crm/crmcompanies" />
	</div>
</script>

<script type="text/html" data-help-name="inwendo-erp">
	<p>Reads and writes vynst (inwendo ERP) data (the functions of the n8n node).</p>
	<h3>Inputs</h3>
	<dl class="message-properties">
		<dt class="optional">payload <span class="property-type">object</span></dt>
		<dd>Fields for <i>Create</i> and <i>Update</i> (wrapped in the form block of the resource), body of a generic request.</dd>
		<dt class="optional">id <span class="property-type">string | number</span></dt>
		<dd>ID for Get, Update, Get PDF and the smart lock actions; overrides the node setting.</dd>
		<dt class="optional">query <span class="property-type">object</span></dt>
		<dd>Query parameters, e.g. <code>{"company": 12}</code> for list filters.</dd>
		<dt class="optional">parentId <span class="property-type">string | number</span></dt>
		<dd>Attendance list of <i>Attendance List Entry → Get Many / Create</i>; overrides the node setting.</dd>
		<dt class="optional">resource, operation, searchString, limit, returnAll, method, endpoint</dt>
		<dd>Override the node settings.</dd>
	</dl>
	<h3>Outputs</h3>
	<dl class="message-properties">
		<dt>payload <span class="property-type">object | array | Buffer</span></dt>
		<dd>Answer of the ERP. <i>Get Many</i> returns an array, <i>Get PDF</i> a Buffer with <code>msg.filename</code> and <code>msg.contentType</code>.</dd>
	</dl>
	<h3>Details</h3>
	<p>
		<i>Update</i> uses <code>PATCH</code>: fields you do not send keep their value. Invoices and offers cannot be
		changed once created. <i>Smart Lock → Unlock / Lock</i> opens or locks an ERP smart lock through its provider
		(Nuki, LOQED, Home Assistant, Node-RED) with the rights of the token's user and writes the smart lock log.
	</p>
	<h4>More resources</h4>
	<ul>
		<li><b>Inventory Loan</b> (ERP setting <code>event_inventory_enabled</code>): <i>Create</i> hands the item of a booking over
			(<code>{"booking": 12, "quantity": 1, "due_at": "…", "deposit_amount": 20}</code>), <i>Return</i>
			(<code>{"condition": "…", "retained_amount": 0, "note": "…"}</code>), <i>Extend</i> (<code>{"due_at": "…"}</code>),
			<i>Stock Overview</i> (all items with lent / free pieces) and <i>Availability</i> of one item
			(ID = bookable, <code>msg.query = {"start": "…", "end": "…"}</code>). Get Many filters:
			<code>state</code> (LENT, RETURNED, OVERDUE), <code>bookable</code>, <code>booking</code>, <code>person</code>.</li>
		<li><b>Attendance List</b> and <b>Attendance List Entry</b>: entries of a list (List ID), create / update entries.
			For check-in by card or QR code use the <i>vynst check-in</i> node.</li>
		<li><b>Shift Plan Entry</b>: shifts (filters <code>startDate</code>, <code>person</code>, <code>status</code>, …);
			<i>Clock In / Clock Out</i> starts or ends the work time of an own shift of the token's user.</li>
		<li><b>Occupancy</b> (ERP setting <code>integration_occupancy_api_enabled</code>): per bookable whether a booking runs now,
			the current and next booking, lead / lag time and opening hours. The optional ID filters bookables (<code>7,8</code>).</li>
		<li><b>Usage Counter</b> (meters of bookables): <i>Set Value</i> writes the reading in <code>msg.payload</code>
			(number or <code>{"value": 1240.2}</code>).</li>
		<li><b>Notification</b>: notifications of the token's person; <i>Mark as Read</i>.</li>
	</ul>
	<p>
		A function that is switched off in the ERP settings shows <i>Funktion im ERP deaktiviert: &lt;setting&gt;</i> as status;
		<code>msg.error.featureDisabled</code> names the setting.
	</p>
	<p>Errors are thrown with the ERP error code and message (<code>X-IW-ERROR-CODE</code> / <code>X-IW-ERROR-JSON</code>), also in <code>msg.error</code>; use a <i>catch</i> node.</p>
</script>
