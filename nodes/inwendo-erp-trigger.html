<script type="text/javascript">
	(function () {
		function randomHex(bytes) {
			const values = new Uint8Array(bytes);
			window.crypto.getRandomValues(values);
			return Array.from(values, (value) => value.toString(16).padStart(2, '0')).join('');
		}

		const ENTITY_TYPES = [
			['all', 'All'],
			['BaseBooking', 'Booking'],
			['CRMCompany', 'Company'],
			['BaseEvent', 'Event'],
			['BaseEventSignUp', 'Event Sign-Up'],
			['Invoice', 'Invoice'],
			['MediaNewsArticle', 'News Article'],
			['Offer', 'Offer'],
			['CRMPerson', 'Person'],
			['CRMProject', 'Project'],
			['SmartLockLog', 'Smart Lock Log'],
			['CustomerTicket', 'Ticket'],
			['TimeEntry', 'Time Entry'],
			['AttendanceList', 'Attendance List'],
			['AttendanceListEntry', 'Attendance List Entry (check-in)'],
			['BaseBookable', 'Bookable'],
			['BaseBookableUsageCounter', 'Usage Counter'],
			['BaseBookingRealUsage', 'Booking Real Usage'],
			['EventBookingSubstitution', 'Booking Substitution'],
			['EventInventoryLoan', 'Inventory Loan'],
			['MembershipPauseRequest', 'Membership Pause Request'],
			['ShiftExchangeRequest', 'Shift Exchange Request'],
			['ShiftPlanEntry', 'Shift Plan Entry'],
			['SmartLock', 'Smart Lock'],
			['UserNotification', 'Notification'],
			['WorkTimeEntry', 'Work Time Entry'],
		];

		RED.nodes.registerType('inwendo-erp-trigger', {
			category: 'vynst (inwendo ERP)',
			color: '#7fb7df',
			defaults: {
				name: { value: '' },
				server: { value: '', type: 'inwendo-erp-config', required: true },
				entityType: { value: 'all' },
				action: { value: 'all' },
				delivery: { value: 'https' },
				publicUrl: {
					value: '',
					validate: function (value) {
						const delivery = $('#node-input-delivery').length ? $('#node-input-delivery').val() : this.delivery;
						return delivery === 'mqtt' || /^https:\/\/.+/i.test(value || '');
					},
				},
				instanceId: { value: '', validate: RED.validators.regex(/^([A-Za-z0-9_-]{8,64})?$/) },
			},
			inputs: 0,
			outputs: 1,
			icon: 'inwendo.png',
			paletteLabel: 'vynst trigger',
			label: function () {
				const entity = ENTITY_TYPES.find((entry) => entry[0] === this.entityType);
				return this.name || 'ERP ' + (entity ? entity[1] : this.entityType) + ' ' + (this.action === 'all' ? '' : this.action);
			},
			oneditprepare: function () {
				const select = $('#node-input-entityType');
				ENTITY_TYPES.forEach((entry) => select.append($('<option>').val(entry[0]).text(entry[1])));
				select.val(this.entityType || 'all');
				// identifies the MQTT delivery of this trigger in the ERP: created once, kept in the flow
				if (!this.instanceId) {
					$('#node-input-instanceId').val('nr-trg-' + randomHex(10));
				}
				$('#node-input-delivery').on('change', function () {
					$('.inwendo-erp-trigger-https').toggle($(this).val() !== 'mqtt');
				}).trigger('change');
			},
		});
	})();
</script>

<script type="text/html" data-template-name="inwendo-erp-trigger">
	<div class="form-row">
		<label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
		<input type="text" id="node-input-name" />
	</div>
	<div class="form-row">
		<label for="node-input-server"><i class="fa fa-server"></i> ERP</label>
		<input type="text" id="node-input-server" />
	</div>
	<div class="form-row">
		<label for="node-input-entityType"><i class="fa fa-database"></i> Entity</label>
		<select id="node-input-entityType"></select>
	</div>
	<div class="form-row">
		<label for="node-input-action"><i class="fa fa-bolt"></i> Action</label>
		<select id="node-input-action">
			<option value="all">All</option>
			<option value="create">Create</option>
			<option value="update">Update</option>
			<option value="delete">Delete</option>
		</select>
	</div>
	<div class="form-row">
		<label for="node-input-delivery"><i class="fa fa-exchange"></i> Delivery</label>
		<select id="node-input-delivery">
			<option value="https">HTTPS webhook (Node-RED reachable from the internet)</option>
			<option value="mqtt">ERP MQTT broker (works behind NAT)</option>
		</select>
	</div>
	<div class="form-row inwendo-erp-trigger-https">
		<label for="node-input-publicUrl"><i class="fa fa-globe"></i> Public URL</label>
		<input type="text" id="node-input-publicUrl" placeholder="https://nodered.example.com" />
	</div>
	<input type="hidden" id="node-input-instanceId" />
	<div class="form-tips">
		<span class="inwendo-erp-trigger-https">The ERP calls <code>&lt;Public URL&gt;/inwendo-erp/webhook/&lt;node id&gt;</code> (below <code>httpNodeRoot</code>).
		It must be <b>https</b> and reachable from the internet.</span>
		With the <b>ERP MQTT broker</b> Node-RED only connects out (ERP setting <code>integration_mqtt_trigger_enabled</code>).
		The token needs <b>Webhook / Write</b>.
	</div>
</script>

<script type="text/html" data-help-name="inwendo-erp-trigger">
	<p>Starts a flow when an entity in vynst (inwendo ERP) is created, updated or deleted.</p>
	<h3>Outputs</h3>
	<dl class="message-properties">
		<dt>payload <span class="property-type">object</span></dt>
		<dd>The webhook body of the ERP (<code>iw_action</code>, <code>iw_entity_class</code>, <code>iw_entity_short_class</code>, entity data).</dd>
		<dt>topic <span class="property-type">string</span></dt>
		<dd><code>&lt;entity&gt;/&lt;action&gt;</code></dd>
		<dt class="optional">webhookData <span class="property-type">object</span></dt>
		<dd>Summary the ERP sends for smart lock log (<code>type: "access"</code>: lock, action, success, person) and
			attendance list entry events (<code>type: "check_in"</code>: list, person, <code>checked_in</code>) instead of the entity data.</dd>
	</dl>
	<h3>Details</h3>
	<p>
		On deploy the node registers its webhook in the ERP (<code>/api/nodered/webhook</code>) with a fresh token and checks
		the <code>X-IW-Webhook-Token</code> header of every call. Removing the node removes the webhook. Changes that Node-RED makes
		itself through the <i>vynst</i> node are not reported back.
	</p>
	<p>
		<b>Delivery over the ERP MQTT broker</b>: the registration returns access to the ERP's broker (websocket over TLS, read
		access to the topic of this trigger only); the node subscribes and registers again every 24 hours and before the access
		runs out. No public URL needed. When the ERP setting <code>integration_mqtt_trigger_enabled</code> is off, the status shows
		<i>Funktion im ERP deaktiviert: integration_mqtt_trigger_enabled</i>.
	</p>
	<p>For booking start / end events use the <i>vynst booking schedule</i> node.</p>
</script>
