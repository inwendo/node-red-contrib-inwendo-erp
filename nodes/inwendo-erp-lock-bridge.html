<script type="text/javascript">
	(function () {
		function randomHex(bytes) {
			const values = new Uint8Array(bytes);
			window.crypto.getRandomValues(values);
			return Array.from(values, (value) => value.toString(16).padStart(2, '0')).join('');
		}

		RED.nodes.registerType('inwendo-erp-lock-bridge', {
			category: 'config',
			defaults: {
				name: { value: 'Node-RED' },
				server: { value: '', type: 'inwendo-erp-config', required: true },
				instanceId: { value: '', required: true, validate: RED.validators.regex(/^[A-Za-z0-9_-]{8,64}$/) },
				delivery: { value: 'mqtt' },
				publicUrl: { value: '' },
			},
			credentials: {
				secret: { type: 'password' },
			},
			label: function () {
				return (this.name || 'lock bridge') + (this.delivery === 'push' ? ' (push)' : '');
			},
			oneditprepare: function () {
				// the instance id and the secret identify this Node-RED in the ERP: created once, kept in the flow
				if (!this.instanceId) {
					$('#node-config-input-instanceId').val('nr-' + randomHex(12));
				}
				if (!this.credentials || !this.credentials.has_secret) {
					$('#node-config-input-secret').val(randomHex(32));
				}
				function update() {
					const push = $('#node-config-input-delivery').val() === 'push';
					$('.inwendo-erp-bridge-push').toggle(push);
				}
				$('#node-config-input-delivery').on('change', update);
				update();
			},
		});
	})();
</script>

<script type="text/html" data-template-name="inwendo-erp-lock-bridge">
	<div class="form-row">
		<label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
		<input type="text" id="node-config-input-name" placeholder="Name of the connection in the ERP" />
	</div>
	<div class="form-row">
		<label for="node-config-input-server"><i class="fa fa-server"></i> ERP</label>
		<input type="text" id="node-config-input-server" />
	</div>
	<div class="form-row">
		<label for="node-config-input-delivery"><i class="fa fa-exchange"></i> Commands</label>
		<select id="node-config-input-delivery">
			<option value="mqtt">MQTT of the ERP (works behind NAT)</option>
			<option value="push">https push (Node-RED reachable from the internet)</option>
		</select>
	</div>
	<div class="form-row inwendo-erp-bridge-push">
		<label for="node-config-input-publicUrl"><i class="fa fa-globe"></i> Public URL</label>
		<input type="text" id="node-config-input-publicUrl" placeholder="https://nodered.example.com" />
	</div>
	<div class="form-row">
		<label for="node-config-input-instanceId"><i class="fa fa-id-badge"></i> Instance ID</label>
		<input type="text" id="node-config-input-instanceId" />
	</div>
	<div class="form-row">
		<label for="node-config-input-secret"><i class="fa fa-key"></i> Secret</label>
		<input type="password" id="node-config-input-secret" />
	</div>
	<div class="form-tips">
		Instance ID and secret are generated once and identify this Node-RED in the ERP. Do not reuse them in
		another Node-RED. After the first deploy open the connection in the ERP (Smart Lock Connections) and run
		<b>Sync devices</b>; then grant the access to the smart locks as usual.
	</div>
</script>

<script type="text/html" data-help-name="inwendo-erp-lock-bridge">
	<p>Connects the <i>vynst lock</i> nodes of this Node-RED to the ERP.</p>
	<h3>Details</h3>
	<p>
		On deploy the bridge registers its locks at <code>/api/nodered/smart_lock/register</code>. The ERP creates a smart
		lock connection (provider Node-RED); an administrator syncs its devices once, the locks then are normal ERP smart
		locks with all access rules (self service, bookable, employment contract, booking).
	</p>
	<ul>
		<li><b>MQTT</b> (default): the ERP hands out access to its MQTT broker with the registration (websocket over TLS,
			read access to the topic of this bridge only). Every command is signed and valid for 30 seconds; the bridge
			reports the result over https. Needs only outgoing connections.</li>
		<li><b>Push</b>: the ERP posts every command to <code>&lt;Public URL&gt;/inwendo-erp/lock/&lt;instance id&gt;</code>
			and gets the result as answer.</li>
	</ul>
	<p>
		Every command is signed with HMAC-SHA256 of the bridge secret and carries a timestamp and a nonce; the bridge
		rejects unsigned, old and replayed commands.
	</p>
	<p>Removing the bridge removes its locks from the ERP; the smart locks stay but cannot be used.</p>
</script>
