name: CI

on:
  push:
    # claude/compassionate-shannon-2bvhp9 is the current default branch (rename it to main later).
    branches: [main, master, claude/compassionate-shannon-2bvhp9]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Runs against a live ERP (with MQTT) when IW_E2E_ERP_HOST / IW_E2E_ERP_TOKEN are
      # configured as repository secrets; without them the tests are skipped.
      - run: npm run test:e2e
        env:
          IW_E2E_ERP_HOST: ${{ secrets.IW_E2E_ERP_HOST }}
          IW_E2E_ERP_TOKEN: ${{ secrets.IW_E2E_ERP_TOKEN }}

  scorecard:
    # Node-RED library scorecard (name, licence, node-red section, examples, dependencies ...).
    # Informational: the library shows the same report after a submission.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
