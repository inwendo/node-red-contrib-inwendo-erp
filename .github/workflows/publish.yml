name: Publish to npm

# Publishes the package when a GitHub release is published, or by hand from the
# Actions tab. Needs the repository secret NPM_TOKEN (an npm automation or
# granular access token that may publish node-red-contrib-inwendo-erp).
# No --provenance: npm only signs provenance for public repositories.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Skip if this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "node-red-contrib-inwendo-erp@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
